<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERION — Бронювання</title>
<style>
  :root{
    --bg:#050505;
    --panel:#0e0e0e;
    --panel2:#161616;
    --border:#2b2b2b;
    --text:#f5f5f5;
    --muted:#8a8a8a;
    --accent:#f5c518;
    --accent-dark:#c9a30f;
    --danger:#ef4444;
    --ok:#22c55e;
    --booked:#3a0d0d;
    --booked-border:#ef4444;
    --radius:6px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);height:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- HEADER ---------- */
  header{
    display:flex;align-items:center;gap:16px;
    padding:14px 22px;background:#000;border-bottom:2px solid var(--accent);
    flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;white-space:nowrap;}
  .logo-txt{
    font-size:21px;font-weight:900;letter-spacing:1px;
    color:#fff;text-transform:uppercase;
  }
  .logo-toggle{
    display:inline-flex;align-items:center;justify-content:flex-start;
    width:30px;height:19px;border:2px solid var(--accent);border-radius:20px;
    margin:0 1px;padding:2px;box-sizing:border-box;
  }
  .logo-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);display:block;}
  .tabs{display:flex;gap:6px;margin-left:8px;}
  .tab-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 16px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#000;}
  .spacer{flex:1;}
  .save-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .dot.saving{background:var(--accent);animation:pulse 1s infinite;}
  .dot.save-error{background:var(--danger);animation:none;}
  @keyframes pulse{50%{opacity:.3;}}
  .retry-btn{
    display:none;background:var(--danger);border:1px solid var(--danger);color:#fff;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    padding:4px 10px;border-radius:4px;cursor:pointer;
  }
  .retry-btn:hover{filter:brightness(1.15);}
  .toggle-edit{
    display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
    padding:7px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;user-select:none;
    text-transform:uppercase;letter-spacing:.4px;font-weight:600;color:var(--text);
  }
  .toggle-edit input{accent-color:var(--accent);width:16px;height:16px;}

  /* ---------- LAYOUT ---------- */
  #bookingView{display:flex;gap:16px;padding:16px;flex:1;align-items:flex-start;flex-wrap:wrap;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin:0 0 10px 0;font-weight:800;border-left:3px solid var(--accent);padding-left:8px;}

  /* ---------- MAP PANEL ---------- */
  #mapPanel{flex:2.6;min-width:480px;order:1;}
  .map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .map-head h2{margin:0;}
  .zoom-controls{display:flex;align-items:center;gap:4px;}
  .zoom-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    width:26px;height:26px;border-radius:4px;cursor:pointer;font-size:15px;font-weight:800;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .zoom-btn:hover{border-color:var(--accent);}
  .zoom-label{
    font-size:11.5px;color:var(--muted);min-width:40px;text-align:center;cursor:pointer;
    user-select:none;font-weight:700;
  }
  #editToolbar{display:none;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;}
  #editToolbar.show{display:flex;}
  .tool-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:7px 11px;border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;
    text-transform:uppercase;letter-spacing:.3px;font-weight:700;
  }
  .tool-btn.active{background:var(--accent);border-color:var(--accent);color:#000;}
  .tool-btn.danger.active{background:var(--danger);border-color:var(--danger);color:#fff;}
  .zone-presets{display:flex;gap:6px;width:100%;order:5;padding-top:8px;border-top:1px solid var(--border);margin-top:2px;}
  .zone-preset-btn{
    border-radius:4px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;
    border:1px solid transparent;color:#000;text-transform:uppercase;letter-spacing:.3px;
  }
  .zone-preset-btn.active{outline:2px solid #fff;}
  .icon-presets{display:flex;gap:6px;width:100%;order:6;padding-top:8px;border-top:1px solid var(--border);margin-top:2px;}
  .icon-preset-btn{
    border-radius:4px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid var(--border);color:var(--text);background:var(--panel2);
    display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.3px;
  }
  .icon-preset-btn.active{outline:2px solid var(--accent);border-color:var(--accent);}
  .icon-marker{
    position:absolute;width:28px;height:28px;border-radius:50%;z-index:2;
    background:var(--panel2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .cat-swatches{display:flex;gap:6px;align-items:center;margin-left:auto;}
  .cat-dot{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;}
  .cat-dot.sel{border-color:#fff;}
  .zone-handle{
    position:absolute;width:12px;height:12px;right:-6px;bottom:-6px;
    background:var(--accent);border:1px solid #000;border-radius:2px;cursor:nwse-resize;z-index:4;
  }
  .wall-handle{
    position:absolute;width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:1px solid #000;cursor:pointer;z-index:5;
  }
  #mapCanvasWrap{overflow:auto;border:1px solid var(--border);border-radius:6px;background:#000;
    max-height:760px;
  }
  #mapCanvasScaler{position:relative;}
  #mapCanvas{
    position:absolute;top:0;left:0;width:1600px;height:1000px;
    transform-origin:0 0;
    background:
      linear-gradient(90deg, rgba(245,197,24,.05) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(rgba(245,197,24,.05) 1px, transparent 1px) 0 0/20px 20px, #000;
  }
  #mapCanvas.tool-active{cursor:crosshair;}
  .empty-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:13px;max-width:280px;line-height:1.5;}

  .seat{
    position:absolute;width:56px;height:56px;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#000;cursor:pointer;
    border:2px solid rgba(0,0,0,.4);user-select:none;z-index:3;
    transition:box-shadow .12s,filter .12s;
    filter:brightness(.45) saturate(.7);
  }
  .seat.selected{box-shadow:0 0 0 3px #fff,0 0 16px 2px rgba(245,197,24,.55);filter:brightness(1.3) saturate(1.2);}
  .seat.booked{background:var(--booked)!important;color:#fff;border-color:var(--booked-border);filter:none;}
  .seat .lbl{pointer-events:none;}
  .seat.dragging{opacity:.8;}

  .zone{position:absolute;border-radius:4px;z-index:1;pointer-events:auto;cursor:default;transition:background .15s,border-color .15s,box-shadow .15s;}
  .zone .zlabel{position:absolute;top:5px;left:7px;font-size:11px;font-weight:800;color:var(--text);opacity:.85;pointer-events:none;text-transform:uppercase;letter-spacing:.6px;}
  .zone.zone-active .zlabel{opacity:1;}

  .wall{position:absolute;height:6px;background:#6a6a6a;border-radius:2px;transform-origin:0 50%;z-index:2;cursor:default;}
  .stairs{
    position:absolute;height:22px;transform-origin:0 50%;z-index:2;cursor:default;
    background:repeating-linear-gradient(90deg,#8a8f9e 0px,#8a8f9e 6px,#5c6070 6px,#5c6070 12px);
    border-radius:2px;border:1px solid #454859;
  }

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block;}

  /* ---------- FORM PANEL ---------- */
  #formPanel{flex:0.85;min-width:230px;max-width:280px;order:3;}
  .field{margin-bottom:8px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .field input, .field textarea, .field select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:46px;}
  .row2{display:flex;gap:6px;}
  .row2 .field{flex:1;}
  .selected-seats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:18px;}
  .chip{background:var(--panel2);border:1px solid var(--accent);color:var(--text);border-radius:4px;padding:3px 7px;font-size:11.5px;display:flex;align-items:center;gap:5px;}
  .chip b{cursor:pointer;color:var(--danger);}
  .btn-row{display:flex;gap:6px;margin-top:10px;}
  .btn{flex:1;padding:9px;border-radius:4px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#000;}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .hint-empty{color:var(--muted);font-size:12.5px;line-height:1.5;}

  /* ---------- LIST PANEL ---------- */
  #listPanel{flex:1;min-width:250px;max-width:320px;max-height:760px;overflow:auto;order:2;}
  .booking-item{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .booking-item:hover{border-color:var(--accent);}
  .booking-item .bi-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .booking-item .bi-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .booking-item .bi-note{font-size:13px;color:var(--text);margin-top:6px;padding:6px 8px;background:rgba(245,197,24,.08);border-left:2px solid var(--accent);border-radius:3px;line-height:1.4;}
  .seat-tag{display:inline-block;background:var(--accent);color:#000;font-weight:800;border-radius:3px;padding:1px 6px;font-size:11px;margin-right:5px;}

  /* ---------- ADMINS ---------- */
  #adminView{display:none;padding:20px;flex:1;}
  #adminView .panel{max-width:520px;margin:0 auto;}
  .admin-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .admin-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;font-size:13.5px;font-weight:600;}
  .admin-item b{cursor:pointer;color:var(--danger);font-weight:700;}
  .admin-empty{color:var(--muted);font-size:12.5px;}

  /* ---------- MODAL ---------- */
  #modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:center;justify-content:center;}
  #modalOverlay.show{display:flex;}
  #modalBox{background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:20px;width:320px;}
  #modalBox h3{margin:0 0 14px 0;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2a2d3d;border-radius:5px;}

  @media (max-width:900px){
    #bookingView{flex-direction:column;}
    #mapCanvasWrap{max-height:420px;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-txt">CYBERI</span><span class="logo-toggle"><span class="logo-dot"></span></span><span class="logo-txt">N</span></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="booking">Бронювання</button>
    <button class="tab-btn" data-tab="admin">Адміністратори</button>
  </div>
  <div class="spacer"></div>
  <button class="toggle-edit" id="exportBtn" type="button" title="Зберегти карту, брони та адмінів у файл">⭳ Експорт даних</button>
  <button class="toggle-edit" id="importBtn" type="button" title="Завантажити раніше збережений файл">⭱ Імпорт даних</button>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
  <label class="toggle-edit">
    <input type="checkbox" id="editModeToggle">
    Редагування карти

  <div class="save-status"><span class="dot" id="saveDot"></span><span id="saveText">Синхронізовано</span><button class="retry-btn" id="retryBtn" type="button">Повторити</button></div>
</header>

<div id="bookingView">

  <div class="panel" id="mapPanel">
    <div class="map-head">
      <h2>Карта клубу</h2>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOut" title="Зменшити масштаб">−</button>
        <span class="zoom-label" id="zoomLabel" title="Скинути масштаб">100%</span>
        <button class="zoom-btn" id="zoomIn" title="Збільшити масштаб">+</button>
      </div>
    </div>
    <div id="editToolbar">
      <button class="tool-btn" data-tool="move">✥ Перемістити</button>
      <button class="tool-btn" data-tool="seat">+ Місце</button>
      <button class="tool-btn" data-tool="zone">+ Зона</button>
      <button class="tool-btn" data-tool="wall">+ Стіна</button>
      <button class="tool-btn" data-tool="stairs">+ Сходи</button>
      <button class="tool-btn" data-tool="icon">+ Іконка</button>
      <button class="tool-btn danger" data-tool="delete">✕ Видалити</button>

      <div class="zone-presets" id="zonePresets"></div>

    <div id="mapCanvasWrap">

        <div id="mapCanvas"></div>

  </div>

  <div class="panel" id="formPanel">
    <h2>Нова бронь</h2>
    <div class="selected-seats" id="selectedSeats"></div>
    <div class="row2">
      <div class="field"><label>Дата</label><input type="date" id="fDate"></div>
      <div class="field"><label>Час</label><input type="time" id="fTime"></div>
    </div>
    <div class="field">
      <label>Номер ПК</label>
      <input type="text" id="fPcNumber" placeholder="Клікніть по ПК на карті або впишіть номер">
    </div>
    <div class="field">
      <label>Адміністратор</label>
      <select id="fAdmin"></select>
    </div>
    <div class="field"><label>Ім'я</label><input type="text" id="fName" placeholder="Ім'я клієнта"></div>
    <div class="field"><label>Номер телефону</label><input type="text" id="fPhone" placeholder="Номер телефону клієнта"></div>
    <div class="field"><label>Коментар</label><textarea id="fNotes" placeholder="Нотатка"></textarea></div>
    <div class="btn-row">
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn primary" id="addBtn">Додати</button>

  <div class="panel" id="listPanel">
    <h2>Список бронювань</h2>

</div>

<div id="adminView">
  <div class="panel">
    <h2>Адміністратори</h2>
    <div class="row2">
      <div class="field" style="flex:2;"><label>Ім'я адміністратора</label><input type="text" id="adminNameInput" placeholder="Напр. Олексій"></div>
      <div class="field" style="flex:0 0 auto;align-self:flex-end;"><button class="btn primary" id="addAdminBtn" style="white-space:nowrap;">Додати</button></div>
    </div>
    <div class="admin-list" id="adminList"></div>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalBox"></div>
</div>

<script>
const CATEGORIES = {
  gamer:        {label:'Gamer Zone',    color:'#22c55e'},
  bootcamp:     {label:'Bootcamp',      color:'#eab308'},
  bootcamppro:  {label:'Bootcamp PRO',  color:'#ef4444'},
  tv:           {label:'TV Zone',       color:'#22d3ee'},
};

const ICONS = {
  bar:     {label:'Бар',          glyph:'🍸'},
  wc:      {label:'WC',           glyph:'🚻'},
  fridge:  {label:'Холодильник',  glyph:'🧊'},
};

const GRID = 20;
const BASE_W = 1600, BASE_H = 1000;
const ZOOM_MIN = 0.35, ZOOM_MAX = 2, ZOOM_STEP = 0.15;

let mapData = {seats:[], zones:[], walls:[], stairs:[], icons:[]};
let bookings = [];
let admins = [];

let state = {
  editMode:false,
  tool:'move',
  addCategory:'gamer',
  zonePreset:null,
  iconPreset:null,
  selectedSeatIds:[],
  editingGroupId:null,
  wallStart:null,
  zoneStart:null,
  dragging:null, // {type,id,offsetX,offsetY}
  currentAdmin:'',
  zoom:1,
};

const $ = (id)=>document.getElementById(id);
const canvas = $('mapCanvas');
const canvasWrap = $('mapCanvasWrap');

/* ---------------- STORAGE ---------------- */
let saveTimer=null;

/* pendingSaves holds every key that failed to persist. Each entry keeps a
   getValue() so a later retry always sends the freshest data (not a stale
   snapshot from the moment it first failed), plus a backoff timer so retries
   keep happening in the background without the user doing anything — the
   "Повторити" button just forces an immediate attempt on top of that. */
const pendingSaves = {};

function updateSaveStatusUI(){
  const keys = Object.keys(pendingSaves);
  $('retryBtn').style.display = keys.length ? 'inline-block' : 'none';
}
function markSaving(){
  $('saveDot').classList.remove('save-error');
  $('saveDot').classList.add('saving');
  $('saveText').textContent='Збереження...';
}
function markSaved(){
  $('saveDot').classList.remove('saving','save-error');
  $('saveText').textContent = Object.keys(pendingSaves).length ? 'Не вдалося зберегти, повторюємо…' : 'Синхронізовано';
  updateSaveStatusUI();
}
function markSaveError(){
  $('saveDot').classList.remove('saving');
  $('saveDot').classList.add('save-error');
  const n = Object.keys(pendingSaves).length;
  $('saveText').textContent = n>1 ? `Не вдалося зберегти (${n}), повторюємо…` : 'Не вдалося зберегти, повторюємо…';
  updateSaveStatusUI();
}

/* Storage set with automatic quick retries — the storage backend occasionally returns a
   transient "Internal server error"; retrying a couple of times resolves it silently
   instead of surfacing a scary console error for something that isn't a real problem. */
async function storageSetWithRetry(key, value, shared, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      await window.storage.set(key, value, shared);
      return true;
    }catch(e){
      lastErr = e;
      if(i<attempts-1) await new Promise(r=>setTimeout(r, 350*(i+1)));
    }
  }
  console.warn('Storage save did not succeed after retries:', lastErr);
  return false;
}

/* Durable save: tries a few times right away; if that still fails, it registers
   the key in pendingSaves and keeps retrying in the background with growing
   delays (capped at 30s) until it succeeds, the user hits "Повторити", or the
   connection comes back online — so a failed save is never silently dropped. */
async function durableSave(key, getValue, shared){
  markSaving();
  clearTimeout((pendingSaves[key]||{}).timer);
  const entry = pendingSaves[key] || {attempts:0};
  entry.getValue = getValue;
  entry.shared = shared;
  pendingSaves[key] = entry;
  const ok = await storageSetWithRetry(key, getValue(), shared, 3);
  if(ok){
    delete pendingSaves[key];
    markSaved();
  }else{
    entry.attempts++;
    markSaveError();
    scheduleAutoRetry(key);
  }
}
function scheduleAutoRetry(key){
  const entry = pendingSaves[key];
  if(!entry) return;
  clearTimeout(entry.timer);
  const delay = Math.min(30000, 1500 * Math.pow(1.7, entry.attempts));
  entry.timer = setTimeout(()=> retryKey(key), delay);
}
async function retryKey(key){
  const entry = pendingSaves[key];
  if(!entry) return;
  markSaving();
  const ok = await storageSetWithRetry(key, entry.getValue(), entry.shared, 2);
  if(ok){
    delete pendingSaves[key];
    markSaved();
  }else{
    entry.attempts++;
    markSaveError();
    scheduleAutoRetry(key);
  }
}
function retryAllPending(){
  Object.keys(pendingSaves).forEach(key=>{ clearTimeout(pendingSaves[key].timer); retryKey(key); });
}
$('retryBtn').addEventListener('click', retryAllPending);

let zoomSaveTimer=null;
function persistZoom(){
  clearTimeout(zoomSaveTimer);
  zoomSaveTimer=setTimeout(()=>{
    durableSave('club-zoom', ()=>String(state.zoom), false);
  }, 400);
}
function applyZoom(persist){
  state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, state.zoom));
  $('mapCanvas').style.transform = `scale(${state.zoom})`;
  $('mapCanvasScaler').style.width = (BASE_W*state.zoom)+'px';
  $('mapCanvasScaler').style.height = (BASE_H*state.zoom)+'px';
  $('zoomLabel').textContent = Math.round(state.zoom*100)+'%';
  if(persist) persistZoom();
}
$('zoomIn').addEventListener('click', ()=>{ state.zoom += ZOOM_STEP; applyZoom(true); });
$('zoomOut').addEventListener('click', ()=>{ state.zoom -= ZOOM_STEP; applyZoom(true); });
$('zoomLabel').addEventListener('click', ()=>{ state.zoom = 1; applyZoom(true); });
$('mapCanvasWrap').addEventListener('wheel', (e)=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  state.zoom += (e.deltaY<0 ? ZOOM_STEP : -ZOOM_STEP);
  applyZoom(true);
}, {passive:false});

/* ---------------- MAP RENDER ---------------- */
const DEFAULT_DURATION = 1;
function currentSlot(){
  return {
    date: $('fDate').value,
    time: $('fTime').value,
    duration: DEFAULT_DURATION
  };
}
function toMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }
function slotsOverlap(aTime,aDur,bTime,bDur){
  const as=toMin(aTime), ae=as+aDur*60;
  const bs=toMin(bTime), be=bs+bDur*60;
  return as<be && bs<ae;
}
function groupIdOf(b){ return b.groupId || b.id; }
function getGroupBookings(gid){ return bookings.filter(b=>groupIdOf(b)===gid); }
function bookingForSeatAtSlot(seatId, slot){
  if(!slot.date || !slot.time) return null;
  return bookings.find(b=> b.seatId===seatId && b.date===slot.date &&
    slotsOverlap(b.time,b.duration, slot.time, slot.duration) &&
    !(state.editingGroupId && groupIdOf(b)===state.editingGroupId));
}

function hexToRgba(hex, a){
  const h=hex.replace('#','');
  const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------------- SEAT CLICK (booking mode) ---------------- */
function onSeatClick(seat, bk){
  if(state.editMode){
    if(state.tool==='delete'){
      customConfirm(`Видалити місце «${seat.label}»?`, ()=>{
        mapData.seats = mapData.seats.filter(s=>s.id!==seat.id);
        saveMap(); renderMap();
      });
      return;
    }
    if(state.tool==='seat' || state.tool==='zone' || state.tool==='wall'){
      return; // placing tool active, ignore clicks on existing seat
    }
    return; // move tool: dragging handled by mousedown, click does nothing
  }
  // booking mode
  if(bk){
    customConfirm(`Місце «${seat.label}» зайняте:\n${bk.name} ${bk.phone||''}\n${bk.date} ${bk.time}${bk.admin?'\nАдміністратор: '+bk.admin:''}\n${bk.notes||''}\n\nВідкрити цю бронь для редагування?`, ()=>{
      loadBookingIntoForm(bk);
    }, {okLabel:'Відкрити'});
    return;
  }
  const idx = state.selectedSeatIds.indexOf(seat.id);
  if(idx>=0) state.selectedSeatIds.splice(idx,1);
  else state.selectedSeatIds.push(seat.id);
  renderMap();
  renderSelectedChips();
}

function renderSelectedChips(){
  const wrap = $('selectedSeats');
  wrap.innerHTML='';
  const labels = [];
  state.selectedSeatIds.forEach(id=>{
    const seat = mapData.seats.find(s=>s.id===id);
    if(!seat) return;
    labels.push(seat.label);
    const chip=document.createElement('div');
    chip.className='chip';
    chip.innerHTML = `${seat.label} <b>×</b>`;
    chip.querySelector('b').addEventListener('click', ()=>{
      state.selectedSeatIds = state.selectedSeatIds.filter(x=>x!==id);
      renderMap(); renderSelectedChips();
    });
    wrap.appendChild(chip);
  });
  $('fPcNumber').value = labels.join(', ');
}

$('fPcNumber').addEventListener('change', ()=>{
  const tokens = $('fPcNumber').value.split(/[,\s]+/).map(t=>t.trim()).filter(Boolean);
  const ids = [];
  tokens.forEach(tok=>{
    const seat = mapData.seats.find(s=>s.label.toLowerCase()===tok.toLowerCase());
    if(seat && !ids.includes(seat.id)) ids.push(seat.id);
  });
  state.selectedSeatIds = ids;
  renderMap();
  renderSelectedChips();
});

/* ---------------- CANVAS CLICK (edit: placing) ---------------- */
function canvasPoint(e){
  const rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left)/state.zoom;
  let y = (e.clientY - rect.top)/state.zoom;
  x = Math.round(x/GRID)*GRID; y = Math.round(y/GRID)*GRID;
  return {x,y};
}

canvas.addEventListener('click', (e)=>{
  if(!state.editMode) return;
  if(e.target !== canvas) return; // only empty-area clicks
  const p = canvasPoint(e);

  if(state.tool==='seat'){
    openSeatModal(null, p);
  }else if(state.tool==='zone'){
    if(!state.zoneStart){
      state.zoneStart = p;
      markTempPoint(p,'zone');
    }else{
      const x=Math.min(state.zoneStart.x,p.x), y=Math.min(state.zoneStart.y,p.y);
      const w=Math.max(20,Math.abs(p.x-state.zoneStart.x)), h=Math.max(20,Math.abs(p.y-state.zoneStart.y));
      state.zoneStart=null; clearTempPoint();
      if(state.zonePreset){
        mapData.zones.push({id:uid(), x,y,w,h, label:state.zonePreset.label, color:state.zonePreset.color});
        saveMap(); renderMap();
      }else{
        openZoneModal(null, {x,y,w,h});
      }
    }
  }else if(state.tool==='wall'){
    if(!state.wallStart){
      state.wallStart = p;
      markTempPoint(p,'wall');
    }else{
      mapData.walls.push({id:uid(), x1:state.wallStart.x, y1:state.wallStart.y, x2:p.x, y2:p.y});
      state.wallStart=null; clearTempPoint();
      saveMap(); renderMap();
    }
  }else if(state.tool==='stairs'){
    if(!state.wallStart){
      state.wallStart = p;
      markTempPoint(p,'wall');
    }else{
      mapData.stairs.push({id:uid(), x1:state.wallStart.x, y1:state.wallStart.y, x2:p.x, y2:p.y});
      state.wallStart=null; clearTempPoint();
      saveMap(); renderMap();
    }
  }else if(state.tool==='icon'){
    if(!state.iconPreset){
      customConfirm('Спочатку оберіть тип іконки (Бар / WC / Холодильник) внизу панелі інструментів.', ()=>{}, {okLabel:'Ок'});
      return;
    }
    mapData.icons.push({id:uid(), x:p.x, y:p.y, type:state.iconPreset.key});
    saveMap(); renderMap();
  }
});

let tempMarker=null;
function markTempPoint(p,kind){
  clearTempPoint();
  tempMarker=document.createElement('div');
  tempMarker.style.position='absolute';
  tempMarker.style.left=(p.x-4)+'px'; tempMarker.style.top=(p.y-4)+'px';
  tempMarker.style.width='8px'; tempMarker.style.height='8px';
  tempMarker.style.borderRadius='50%';
  tempMarker.style.background = kind==='wall' ? '#4b4f63':'#5b8def';
  tempMarker.style.zIndex=9;
  canvas.appendChild(tempMarker);
}
function clearTempPoint(){ if(tempMarker){ tempMarker.remove(); tempMarker=null; } }

/* ---------------- DRAG TO MOVE ---------------- */
function onElMouseDown(e, type, id){
  if(!state.editMode || state.tool!=='move') return;
  e.stopPropagation();
  const p = canvasPoint(e);
  let orig;
  if(type==='seat') orig = mapData.seats.find(s=>s.id===id);
  if(type==='zone') orig = mapData.zones.find(z=>z.id===id);
  if(type==='wall') orig = mapData.walls.find(w=>w.id===id);
  if(type==='stairs') orig = mapData.stairs.find(w=>w.id===id);
  if(type==='icon') orig = mapData.icons.find(i=>i.id===id);
  if(!orig) return;
  state.dragging = {type,id, startX:p.x, startY:p.y, orig:JSON.parse(JSON.stringify(orig))};
  state.dragMoved=false;
}
function onResizeMouseDown(e, zone){
  e.stopPropagation(); e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  state.resizing = {id:zone.id, startX:(e.clientX-rect.left)/state.zoom, startY:(e.clientY-rect.top)/state.zoom, origW:zone.w, origH:zone.h};
}
function onWallEndMouseDown(e, wall, end, type){
  e.stopPropagation(); e.preventDefault();
  state.wallEndDrag = {id:wall.id, end, type:type||'wall'};
}

document.addEventListener('mousemove',(e)=>{
  const rect = canvas.getBoundingClientRect();
  let x = (e.clientX-rect.left)/state.zoom, y=(e.clientY-rect.top)/state.zoom;
  x=Math.round(x/GRID)*GRID; y=Math.round(y/GRID)*GRID;

  if(state.resizing){
    const z = mapData.zones.find(o=>o.id===state.resizing.id);
    if(z){
      const dx = x-state.resizing.startX, dy=y-state.resizing.startY;
      z.w = Math.max(30, state.resizing.origW+dx);
      z.h = Math.max(30, state.resizing.origH+dy);
      renderMap();
    }
    return;
  }
  if(state.wallEndDrag){
    const arr = state.wallEndDrag.type==='stairs' ? mapData.stairs : mapData.walls;
    const w = arr.find(o=>o.id===state.wallEndDrag.id);
    if(w){
      if(state.wallEndDrag.end==='1'){ w.x1=x; w.y1=y; } else { w.x2=x; w.y2=y; }
      renderMap();
    }
    return;
  }
  if(!state.dragging) return;
  const dx = x-state.dragging.startX, dy=y-state.dragging.startY;
  if(Math.abs(dx)>2||Math.abs(dy)>2) state.dragMoved=true;
  const {type,id,orig} = state.dragging;
  if(type==='seat'){
    const s = mapData.seats.find(o=>o.id===id);
    if(s){ s.x=orig.x+dx; s.y=orig.y+dy; renderMap(); }
  }else if(type==='zone'){
    const z = mapData.zones.find(o=>o.id===id);
    if(z){ z.x=orig.x+dx; z.y=orig.y+dy; renderMap(); }
  }else if(type==='wall'){
    const w = mapData.walls.find(o=>o.id===id);
    if(w){ w.x1=orig.x1+dx; w.y1=orig.y1+dy; w.x2=orig.x2+dx; w.y2=orig.y2+dy; renderMap(); }
  }else if(type==='stairs'){
    const w = mapData.stairs.find(o=>o.id===id);
    if(w){ w.x1=orig.x1+dx; w.y1=orig.y1+dy; w.x2=orig.x2+dx; w.y2=orig.y2+dy; renderMap(); }
  }else if(type==='icon'){
    const ic = mapData.icons.find(o=>o.id===id);
    if(ic){ ic.x=orig.x+dx; ic.y=orig.y+dy; renderMap(); }
  }
});
document.addEventListener('mouseup',()=>{
  if(state.dragging){ saveMap(); state.dragging=null; }
  if(state.resizing){ saveMap(); state.resizing=null; renderMap(); }
  if(state.wallEndDrag){ saveMap(); state.wallEndDrag=null; renderMap(); }
});

/* zone/wall delete via delete tool (click) */
canvas.addEventListener('click',(e)=>{
  if(!state.editMode || state.tool!=='delete') return;
});

/* ---------------- MODALS ---------------- */
function openModal(html, onMount){
  $('modalBox').innerHTML = html;
  $('modalOverlay').classList.add('show');
  if(onMount) onMount();
}
function closeModal(){ $('modalOverlay').classList.remove('show'); }
$('modalOverlay').addEventListener('click',(e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* Custom confirm dialog (native confirm() can be blocked/no-op inside sandboxed artifact frames) */
function customConfirm(message, onConfirm, opts){
  opts = opts || {};
  const okLabel = opts.okLabel || 'Так, видалити';
  openModal(`
    <h3>Підтвердження</h3>
    <p style="font-size:13.5px;color:var(--text);line-height:1.5;margin:0 0 4px;white-space:pre-line;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn" id="cCancel">Скасувати</button>
      <button class="btn danger" id="cOk">${escapeHtml(okLabel)}</button>
    </div>
  `, ()=>{
    $('cCancel').addEventListener('click', closeModal);
    $('cOk').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
  });
}

function openSeatModal(seat, pos){
  const isNew = !seat;
  const nextNum = () => {
    const nums = mapData.seats.map(s=>parseInt(s.label)).filter(n=>!isNaN(n));
    return nums.length ? Math.max(...nums)+1 : 1;
  };
  const label = isNew ? String(nextNum()) : seat.label;
  const cat = isNew ? state.addCategory : seat.category;

  let optsHtml = Object.entries(CATEGORIES).map(([k,c])=>
    `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer;">
      <input type="radio" name="mcat" value="${k}" ${k===cat?'checked':''}>
      <span style="width:14px;height:14px;border-radius:4px;background:${c.color};display:inline-block;"></span>
      ${c.label}
    </label>`).join('');

  openModal(`
    <h3>${isNew?'Нове місце':'Редагувати місце'}</h3>
    <div class="field"><label>Назва / номер</label><input type="text" id="mLabel" value="${label}"></div>
    <div class="field"><label>Категорія</label>${optsHtml}</div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Скасувати</button>
      ${!isNew?'<button class="btn danger" id="mDelete">Видалити</button>':''}
      <button class="btn primary" id="mSave">Зберегти</button>
    </div>
  `, ()=>{
    $('mCancel').addEventListener('click', closeModal);
    if(!isNew){
      $('mDelete').addEventListener('click', ()=>{
        customConfirm('Видалити це місце?', ()=>{
          mapData.seats = mapData.seats.filter(s=>s.id!==seat.id);
          saveMap(); renderMap(); closeModal();
        });
      });
    }
    $('mSave').addEventListener('click', ()=>{
      const newLabel = $('mLabel').value.trim() || label;
      const newCat = document.querySelector('input[name="mcat"]:checked').value;
      if(isNew){
        mapData.seats.push({id:uid(), x:pos.x, y:pos.y, label:newLabel, category:newCat});
      }else{
        seat.label = newLabel; seat.category = newCat;
      }
      saveMap(); renderMap(); closeModal();
    });
  });
}

function openZoneModal(zone, pos){
  const isNew = !zone;
  const label = isNew ? '' : zone.label;
  const color = isNew ? '#5b8def' : zone.color;
  const presetColors = ['#5b8def','#29b6f6','#eab308','#ef4444','#a78bfa','#22c55e','#f97316','#94a3b8'];
  const swHtml = presetColors.map(c=>`<div class="cat-dot preset-color" data-c="${c}" style="background:${c};${c===color?'border-color:#fff':''}"></div>`).join('');

  openModal(`
    <h3>${isNew?'Нова зона':'Редагувати зону'}</h3>
    <div class="field"><label>Назва зони</label><input type="text" id="zLabel" value="${label}" placeholder="Напр. Зала VIP"></div>
    <div class="field"><label>Колір</label><div style="display:flex;gap:6px;flex-wrap:wrap;">${swHtml}</div></div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Скасувати</button>
      ${!isNew?'<button class="btn danger" id="mDelete">Видалити</button>':''}
      <button class="btn primary" id="mSave">Зберегти</button>
    </div>
  `, ()=>{
    let chosen = color;
    document.querySelectorAll('.preset-color').forEach(d=>{
      d.addEventListener('click', ()=>{
        document.querySelectorAll('.preset-color').forEach(x=>x.style.borderColor='transparent');
        d.style.borderColor='#fff';
        chosen = d.dataset.c;
      });
    });
    $('mCancel').addEventListener('click', ()=>{
      if(isNew) renderMap();
      closeModal();
    });
    if(!isNew){
      $('mDelete').addEventListener('click', ()=>{
        customConfirm('Видалити цю зону?', ()=>{
          mapData.zones = mapData.zones.filter(z=>z.id!==zone.id);
          saveMap(); renderMap(); closeModal();
        });
      });
    }
    $('mSave').addEventListener('click', ()=>{
      const newLabel = $('zLabel').value.trim();
      if(isNew){
        mapData.zones.push({id:uid(), x:pos.x, y:pos.y, w:pos.w, h:pos.h, label:newLabel, color:chosen});
      }else{
        zone.label = newLabel; zone.color = chosen;
      }
      saveMap(); renderMap(); closeModal();
    });
  });
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

/* ---------------- BOOKING FORM ---------------- */
function initDefaultDateTime(){
  const now = new Date();
  $('fDate').value = now.toISOString().slice(0,10);
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(Math.round(now.getMinutes()/5)*5 % 60).padStart(2,'0');
  $('fTime').value = `${h}:${m}`;
}

['fDate','fTime'].forEach(id=>{
  $(id).addEventListener('change', renderMap);
});

$('clearBtn').addEventListener('click', clearForm);
function clearForm(){
  state.selectedSeatIds=[];
  state.editingGroupId=null;
  $('fName').value=''; $('fPhone').value=''; $('fNotes').value='';
  if(state.currentAdmin) $('fAdmin').value = state.currentAdmin;
  $('editRow').style.display='none';
  $('addBtn').textContent='Додати';
  renderSelectedChips(); renderMap();
}

$('addBtn').addEventListener('click', ()=>{
  const slot = currentSlot();
  const name = $('fName').value.trim();
  const phone = $('fPhone').value.trim();
  const notes = $('fNotes').value.trim();
  const admin = $('fAdmin').value;

  if(!slot.date || !slot.time){ alert('Вкажіть дату та час.'); return; }
  if(!name){ alert("Вкажіть ім'я клієнта."); return; }

  if(state.editingGroupId){
    // editing an existing booking (single seat or a group of seats booked together)
    const gid = state.editingGroupId;
    const group = getGroupBookings(gid);
    if(group.length===0){ return; }
    let anyConflict=false;
    group.forEach(b=>{
      const conflict = bookings.find(x=> groupIdOf(x)!==gid && x.seatId===b.seatId && x.date===slot.date && slotsOverlap(x.time,x.duration,slot.time,slot.duration));
      if(conflict) anyConflict=true;
    });
    const applyEdit = async ()=>{
      group.forEach(b=>{ b.date=slot.date; b.time=slot.time; b.duration=slot.duration; b.name=name; b.phone=phone; b.notes=notes; b.admin=admin; });
      await saveBookings();
      clearForm(); renderBookingsList(); renderMap();
    };
    if(anyConflict){
      customConfirm('На цей час одне або кілька місць вже зайняті іншою бронею. Все одно зберегти?', applyEdit);
    }else{
      applyEdit();
    }
    return;
  }

  if(state.selectedSeatIds.length===0){ alert('Оберіть хоча б одне місце на карті.'); return; }

  let anyConflict=false;
  state.selectedSeatIds.forEach(seatId=>{
    if(bookings.find(b=>b.seatId===seatId && b.date===slot.date && slotsOverlap(b.time,b.duration,slot.time,slot.duration))) anyConflict=true;
  });

  const createBookings = async ()=>{
    const groupId = uid();
    state.currentAdmin = admin;
    state.selectedSeatIds.forEach(seatId=>{
      bookings.push({id:uid(), groupId, seatId, date:slot.date, time:slot.time, duration:slot.duration, name, phone, notes, admin, createdAt:Date.now()});
    });
    await saveBookings();
    clearForm();
    renderBookingsList();
    renderMap();
  };
  if(anyConflict){
    customConfirm('Одне або кілька обраних місць вже зайняті на цей час. Все одно створити бронь?', createBookings);
  }else{
    createBookings();
  }
});

function loadBookingIntoForm(b){
  const gid = groupIdOf(b);
  const group = getGroupBookings(gid);
  state.editingGroupId = gid;
  $('fDate').value=b.date; $('fTime').value=b.time;
  $('fName').value=b.name; $('fPhone').value=b.phone||''; $('fNotes').value=b.notes||'';
  $('fAdmin').value = b.admin || '';
  $('editRow').style.display='flex';
  $('addBtn').textContent='Зберегти зміни';
  state.selectedSeatIds = group.map(x=>x.seatId).filter(id=>mapData.seats.some(s=>s.id===id));
  renderSelectedChips();
  renderMap();
  document.querySelector('.tab-btn[data-tab="booking"]').click();
}

$('deleteBookingBtn').addEventListener('click', ()=>{
  if(!state.editingGroupId) return;
  const gid = state.editingGroupId;
  const group = getGroupBookings(gid);
  const msg = group.length>1 ? `Видалити цю бронь (${group.length} місць)?` : 'Видалити цю бронь?';
  customConfirm(msg, async ()=>{
    bookings = bookings.filter(b=>groupIdOf(b)!==gid);
    await saveBookings();
    clearForm();
    renderBookingsList();
    renderMap();
  });
});

/* ---------------- BOOKINGS LIST ---------------- */
function renderBookingsList(){
  const wrap = $('bookingsList');
  wrap.innerHTML='';
  const todayStr = new Date().toISOString().slice(0,10);

  const groups = {};
  const order = [];
  bookings.forEach(b=>{
    if(b.date < todayStr) return;
    const gid = groupIdOf(b);
    if(!groups[gid]){ groups[gid]=[]; order.push(gid); }
    groups[gid].push(b);
  });
  const sorted = order
    .map(gid=>groups[gid])
    .sort((ga,gb)=> (ga[0].date+ga[0].time).localeCompare(gb[0].date+gb[0].time));

  if(sorted.length===0){
    wrap.innerHTML = '<p class="hint-empty">Поки немає бронювань.</p>';
    return;
  }
  sorted.forEach(group=>{
    const b = group[0];
    const seatTags = group.map(gb=>{
      const seat = mapData.seats.find(s=>s.id===gb.seatId);
      return `<span class="seat-tag">${seat?escapeHtml(seat.label):'?'}</span>`;
    }).join('');
    const item=document.createElement('div');
    item.className='booking-item';
    item.innerHTML = `
      <div class="bi-top"><span>${seatTags}${escapeHtml(b.name)}</span><span>${b.time}</span></div>
      <div class="bi-meta">${formatDate(b.date)}${b.phone?' · '+escapeHtml(b.phone):''}${b.admin?' · '+escapeHtml(b.admin):''}</div>
      ${b.notes?`<div class="bi-note">${escapeHtml(b.notes)}</div>`:''}
    `;
    item.addEventListener('click', ()=>loadBookingIntoForm(b));
    wrap.appendChild(item);
  });
}
function formatDate(d){
  const [y,m,day]=d.split('-');
  return `${day}.${m}.${y}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- BACKUP: EXPORT / IMPORT ---------------- */
$('exportBtn').addEventListener('click', ()=>{
  const backup = { mapData, bookings, admins, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cyberion-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

$('importBtn').addEventListener('click', ()=> $('importFile').click());
$('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){
      customConfirm('Не вдалося прочитати файл — переконайтесь, що це коректний JSON-бекап.', ()=>{}, {okLabel:'Ок'});
      return;
    }
    customConfirm('Імпортувати дані з файлу? Це замінить поточну карту, брони та адміністраторів у цьому вікні даними з файлу.', async ()=>{
      if(data.mapData){
        mapData = data.mapData;
        if(!mapData.seats) mapData.seats=[];
        if(!mapData.zones) mapData.zones=[];
        if(!mapData.walls) mapData.walls=[];
        if(!mapData.stairs) mapData.stairs=[];
        if(!mapData.icons) mapData.icons=[];
      }
      if(Array.isArray(data.bookings)) bookings = data.bookings;
      if(Array.isArray(data.admins)) admins = data.admins;
      await Promise.all([
        durableSave('club-map', ()=>JSON.stringify(mapData), true),
        durableSave('club-bookings', ()=>JSON.stringify(bookings), true),
        durableSave('club-admins', ()=>JSON.stringify(admins), true),
      ]);
      clearForm();
      renderAll();
    }, {okLabel:'Так, імпортувати'});
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------------- INIT ---------------- */
function renderAll(){
  renderLegend();
  renderMap();
  renderBookingsList();
  renderSelectedChips();
  renderAdmins();
}
buildToolbar();
initDefaultDateTime();
loadAll();
</script>
